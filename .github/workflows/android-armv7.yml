name: Build AUREXIS Browser 2 (ARMv7)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/android-armv7.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Build ARMv7 debug APK
        run: |
          chmod +x gradlew build.sh
          ./gradlew --no-daemon --stacktrace :app:clean :app:assembleDebug
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | head -n 8
      - uses: actions/upload-artifact@v4
        with:
          name: AUREXIS-Browser-2.0-ARMv7-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
