plugins { id 'com.android.application' }

android {
    namespace 'com.aurexis.browser'
    compileSdk 37
    defaultConfig {
        applicationId 'com.aurexis.browser'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
        ndk { abiFilters 'armeabi-v7a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'org.mozilla.geckoview:geckoview-armeabi-v7a:160.0.20261104181552'
}
